  # SimplePIR README at the pinned SHA (spec 3), the one-bit anchor: 1 GiB as 2^33 one-bit entries
  # (decision 21). The README's MB and KB are binary: the hint is ell x n x 4 B and the online bytes
  # (m + ell) x 4 B, and only MiB and KiB put them near 121 and 242. The 5 % text tolerance gives the
  # same verdict under either reading.
  - {id: R23, ref: R23, where: "SimplePIR README, Benchmarks", claim: "S0-go hint, 2^33 one-bit entries",
     published: "121 MB of offline download", check: abs, rule: exact, precision: text,
     num: {arm: S0-go, record: null}, metric: offline_down_bytes_hint_only, db: [1GiB], value: 121, unit: MiB}
  - {id: R24, ref: R24, where: "SimplePIR README, Benchmarks", claim: "S0-go online bytes, 2^33 one-bit entries",
     published: "242 KB of online communication", check: abs, rule: exact, precision: text,
     num: {arm: S0-go, record: null}, metric: online_bytes, db: [1GiB], value: 242, unit: KiB}
  - {id: R25, ref: R25, where: "SimplePIR README, Benchmarks", claim: "S0-go server throughput, one core",
     published: "a throughput of roughly 10 GB/s/core", check: abs, rule: hw, precision: text,
     num: {arm: S0-go, record: null}, metric: throughput_GBps, db: [1GiB], value: 10, unit: GB/s}
  - id: R12
    ref: R12
    where: "§7.3, p.3847"
    claim: "S0-go hint smaller than the S3 digest"
    published: "Concrete offline bandwidth is lower in SimplePIR due to database packing"
    check: less
    rule: exact
    precision: text
    num: {arm: S0-go, record: 256B}
    den: {arm: S3, record: null}
    metric: offline_down_bytes_hint_only
    db: [1MiB, 16MiB, 128MiB, 1GiB]
    unit: x

  # VeriSimplePIR [dCL24]. Compute only, at our sizes (decision 7). Record size: the spec 5 anchor,
  # 1 KiB; the paper uses 1-bit entries. TODO[HUMAN]: confirm the record size to compare at.
  - id: R17-S1
