# Reproduction targets our Tier 1 grid can compute (RQ1). analysis/reproduce.py reads this file.
# Every value and range is copied from docs/reproduction_targets.md, which cites the paper page.
# The targets that file lists but our grid cannot compute are left out here, with the reason:
#   R6        tECC is a parameter check on scheme_params, not a measured ratio.
#   R7        needs a run of the base LWE scheme without amplification; no arm runs it.
#   R8        DDH at 1 GiB comes from the S4 extrapolation (decision 10, notebooks/06_s4_cost.ipynb).
#   R4        two to five servers is Tier 3 (M1-k).
#   R13, R14  headline ranges over 4 GiB and up, against 32-bit SimplePIR; R15 and R16 keep the compute part.
#   R18-R21   communication at 4 to 256 GiB, recomputed with params.cpp (decision 7), not from the grid.
#   R22       the source sentence is garbled (TODO[HUMAN] in docs/reproduction_targets.md).
#   R26-R28   DoublePIR is optional (Tier 3); R23-R25, the SimplePIR one-bit anchor, are below.
#
# Fields
#   check: ratio      measured median(num)/median(den) per listed db size, against value or range
#          max_ratio  the largest ratio over the listed db sizes must not exceed value
#          trend_up   the ratio must not fall as db size grows
#          less       num must be smaller than den (ratio < 1) at each listed db size
#          abs        the median of one arm's metric, against value
#   rule: exact (communication, deterministic) | hw (compute; abs targets report the hardware factor only)
#   precision: text (exact quote, +-5 %, spec H1) | plot (read off a figure, factor 1.2 per the doc)
#   context: true marks a target against a different baseline than ours (decision 6); reported, never pass/fail
#   record: a record size, or null for the one-bit arms S3 and S4
#   unit: of value and range; x for ratios

targets:
  # Colombo et al. [CNCG+23], two servers, 1 KiB records (spec 5 anchor)
  - id: R1-time
    ref: R1
    where: "§7.1, Fig 3, p.3845"
    claim: "Maximum M1/M0 user-time overhead"
    published: "maximum overhead of 2.9× for user time"
    check: max_ratio
    rule: hw
    precision: text
    num: {arm: M1, record: 1KiB}
    den: {arm: M0, record: 1KiB}
    metric: user_time_s
    db: [1MiB, 16MiB, 128MiB, 1GiB]
    value: 2.9
    unit: x
  - id: R1-bw
    ref: R1
    where: "§7.1, Fig 3, p.3845"
    claim: "Maximum M1/M0 bandwidth overhead"
    published: "maximum overhead of ... 1.8× for bandwidth"
    check: max_ratio
    rule: exact
    precision: text
    num: {arm: M1, record: 1KiB}
    den: {arm: M0, record: 1KiB}
    metric: online_bytes
    db: [1MiB, 16MiB, 128MiB, 1GiB]
    value: 1.8
    unit: x
  - id: R2-time
    ref: R2
    where: "§7.1, p.3845"
    claim: "M1/M0 user-time overhead grows with database size"
    published: "Both the user time and the bandwidth overheads increase as the database size increases"
    check: trend_up
    rule: hw
    precision: text
    num: {arm: M1, record: 1KiB}
    den: {arm: M0, record: 1KiB}
    metric: user_time_s
    db: [1MiB, 16MiB, 128MiB, 1GiB]
    unit: x
  - id: R2-bw
    ref: R2
    where: "§7.1, p.3845"
    claim: "M1/M0 bandwidth overhead grows with database size"
    published: "Both the user time and the bandwidth overheads increase as the database size increases"
    check: trend_up
    rule: exact
    precision: text
    num: {arm: M1, record: 1KiB}
    den: {arm: M0, record: 1KiB}
    metric: online_bytes
    db: [1MiB, 16MiB, 128MiB, 1GiB]
    unit: x
  - id: R3-time-ratio
    ref: R3
    where: "Fig 3, p.3845 (note R1a)"
    claim: "M1/M0 user time at 1 GiB"
    published: "At 1 GiB the plot gives about 1.9× user time"
    check: ratio
    rule: hw
    precision: plot
    num: {arm: M1, record: 1KiB}
    den: {arm: M0, record: 1KiB}
    metric: user_time_s
    db: [1GiB]
    value: 1.9
    unit: x
  - id: R3-bw-ratio
    ref: R3
    where: "Fig 3, p.3845 (note R1a)"
    claim: "M1/M0 bandwidth at 1 GiB"
    published: "At 1 GiB the plot gives ... about 1.6× bandwidth"
    check: ratio
    rule: exact
    precision: plot
    num: {arm: M1, record: 1KiB}
    den: {arm: M0, record: 1KiB}
    metric: online_bytes
    db: [1GiB]
    value: 1.6
    unit: x
  - {id: R3-time-M0, ref: R3, where: "Fig 3, p.3845", claim: "M0 user time at 1 GiB",
     published: "user time [s] axis: unauthenticated about 0.13", check: abs, rule: hw, precision: plot,
     num: {arm: M0, record: 1KiB}, metric: user_time_s, db: [1GiB], value: 0.13, unit: s}
  - {id: R3-time-M1, ref: R3, where: "Fig 3, p.3845", claim: "M1 user time at 1 GiB",
     published: "authenticated about 0.25", check: abs, rule: hw, precision: plot,
     num: {arm: M1, record: 1KiB}, metric: user_time_s, db: [1GiB], value: 0.25, unit: s}
  - {id: R3-bw-M0, ref: R3, where: "Fig 3, p.3845", claim: "M0 bandwidth at 1 GiB",
     published: "bandwidth [MiB] axis: unauthenticated about 2.1", check: abs, rule: exact, precision: plot,
     num: {arm: M0, record: 1KiB}, metric: online_bytes, db: [1GiB], value: 2.1, unit: MiB}
  - {id: R3-bw-M1, ref: R3, where: "Fig 3, p.3845", claim: "M1 bandwidth at 1 GiB",
     published: "authenticated about 3.4", check: abs, rule: exact, precision: plot,
     num: {arm: M1, record: 1KiB}, metric: online_bytes, db: [1GiB], value: 3.4, unit: MiB}

