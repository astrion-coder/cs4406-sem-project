[project]
name = "cs4406-sem-project"
version = "0.1.0"
description = "The Price of Verifiability in PIR: a common-hardware benchmark of verifiable PIR schemes"
readme = "README.md"
authors = [
    { name = "ImanKalyanChakraborty", email = "imankc1975@gmail.com" }
]
requires-python = "==3.11.*"
dependencies = [
    "jsonschema>=4.26.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "psutil>=7.2.2",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.1",
    "pytest>=9.1.1",
]
